[project]
name = "prelinger"
version = "0.1.0"
description = "Prelinger Archive clip pipeline for the TIAT speculative design exhibition film"
requires-python = ">=3.12"
dependencies = [
    "internetarchive>=5.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
    "open-clip-torch>=2.30",
    "pillow>=10.0",
]

[project.scripts]
prelinger = "prelinger.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prelinger"]
